<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cliff FX — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="supabase.min.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-mark">Cliff FX</div>
    <p class="auth-sub">Account manager</p>

    <form id="auth-form">
      <label class="field-label" for="auth-email">Email</label>
      <input type="email" id="auth-email" placeholder="you@example.com" required />

      <label class="field-label" for="auth-password">Password</label>
      <input type="password" id="auth-password" placeholder="••••••••" required minlength="6" />

      <p id="auth-error" class="form-error hidden"></p>

      <button type="submit" id="auth-submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <button id="auth-toggle" class="link-btn">Need an account? Sign up</button>
  </div>
</div>

<script src="supabaseClient.js"></script>
<script src="auth.js"></script>
</body>
</html>
